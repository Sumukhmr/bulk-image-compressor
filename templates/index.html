<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Reducer - Smart Compression</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: scale(1.02);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #555;
            font-size: 1.1rem;
        }

        .upload-hint {
            color: #888;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 10px;
            display: none;
        }

        .file-list.has-files {
            display: block;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: #f9f9f9;
        }

        .file-name {
            color: #333;
            font-size: 0.9rem;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            color: #888;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: #ff3344;
            transform: scale(1.1);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-bottom: 20px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .results {
            display: none;
            background: #f8fff8;
            border: 1px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
        }

        .results.active {
            display: block;
        }

        .results h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .result-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #666;
            flex-wrap: wrap;
        }

        .result-reduction {
            color: #4CAF50;
            font-weight: 600;
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .error-msg {
            background: #fff5f5;
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-msg.active {
            display: block;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Image Reducer</h1>
        <p class="subtitle">Compress images to ~500KB without losing quality</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to select images or drag & drop</div>
            <div class="upload-hint">Supports PNG, JPG, JPEG, WebP, TIFF, BMP</div>
        </div>
        <input type="file" id="fileInput" multiple accept="image/*">
        
        <div class="file-list" id="fileList"></div>
        
        <div class="error-msg" id="errorMsg"></div>
        
        <div class="buttons">
            <button class="btn btn-secondary" id="clearBtn">Clear All</button>
            <button class="btn btn-primary" id="compressBtn" disabled>Compress Images</button>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Processing...</div>
        </div>
        
        <div class="results" id="results">
            <h3>✅ Compression Complete</h3>
            <div id="resultsList"></div>
            <button class="download-btn" id="downloadAllBtn">⬇️ Download All</button>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let filesToDownload = [];

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const compressBtn = document.getElementById('compressBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const results = document.getElementById('results');
        const resultsList = document.getElementById('resultsList');
        const errorMsg = document.getElementById('errorMsg');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            addFiles(e.target.files);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });

        function addFiles(files) {
            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                        selectedFiles.push(file);
                    }
                }
            }
            updateFileList();
            hideError();
        }

        function updateFileList() {
            fileList.innerHTML = '';
            
            if (selectedFiles.length > 0) {
                fileList.classList.add('has-files');
                compressBtn.disabled = false;
                
                selectedFiles.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${formatSize(file.size)}</span>
                        <button class="remove-btn" onclick="removeFile(${index})">×</button>
                    `;
                    fileList.appendChild(item);
                });
            } else {
                fileList.classList.remove('has-files');
                compressBtn.disabled = true;
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        clearBtn.addEventListener('click', () => {
            selectedFiles = [];
            updateFileList();
            results.classList.remove('active');
            hideError();
        });

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('active');
        }

        function hideError() {
            errorMsg.classList.remove('active');
        }

        compressBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            
            hideError();
            results.classList.remove('active');
            progressContainer.classList.add('active');
            compressBtn.disabled = true;
            
            resultsList.innerHTML = '';
            filesToDownload = [];
            let completed = 0;
            let resultsData = [];
            
            for (let file of selectedFiles) {
                progressText.textContent = `Processing ${file.name}... (${completed + 1}/${selectedFiles.length})`;
                progressFill.style.width = `${(completed / selectedFiles.length) * 100}%`;
                
                try {
                    const formData = new FormData();
                    formData.append('image', file);
                    
                    const response = await fetch('/api/compress', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        resultsData.push(data);
                        filesToDownload.push({
                            display: data.new_name,
                            safe: data.safe_filename || data.new_name
                        });
                    } else {
                        resultsData.push({
                            error: true,
                            original_name: file.name,
                            message: data.error || 'Compression failed'
                        });
                    }
                } catch (err) {
                    resultsData.push({
                        error: true,
                        original_name: file.name,
                        message: err.message
                    });
                }
                
                completed++;
            }
            
            progressFill.style.width = '100%';
            progressText.textContent = 'Complete!';
            
            setTimeout(() => {
                progressContainer.classList.remove('active');
                displayResults(resultsData);
                compressBtn.disabled = false;
            }, 500);
        });

        function displayResults(data) {
            resultsList.innerHTML = '';
            
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                
                if (item.error) {
                    div.innerHTML = `
                        <div class="result-name">❌ ${item.original_name}</div>
                        <div class="result-stats">Error: ${item.message}</div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="result-name">${item.new_name}</div>
                        <div class="result-stats">
                            <span>Original: ${formatSize(item.original_size)}</span>
                            <span>New: ${formatSize(item.new_size)}</span>
                            <span class="result-reduction">${item.reduction.toFixed(1)}% smaller</span>
                        </div>
                    `;
                }
                
                resultsList.appendChild(div);
            });
            
            downloadAllBtn.textContent = `⬇️ Download ${filesToDownload.length === 1 ? 'Image' : 'All (' + filesToDownload.length + ' images)'}`;
            results.classList.add('active');
        }

        // Download All button
        downloadAllBtn.addEventListener('click', async () => {
            if (filesToDownload.length === 0) return;
            
            downloadAllBtn.textContent = '⏳ Downloading...';
            downloadAllBtn.style.pointerEvents = 'none';
            
            for (let i = 0; i < filesToDownload.length; i++) {
                const fileInfo = filesToDownload[i];
                
                const link = document.createElement('a');
                link.href = `/api/download/${encodeURIComponent(fileInfo.safe)}`;
                link.download = fileInfo.display;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                if (i < filesToDownload.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }
            
            downloadAllBtn.textContent = `⬇️ Download ${filesToDownload.length === 1 ? 'Image' : 'All (' + filesToDownload.length + ' images)'}`;
            downloadAllBtn.style.pointerEvents = 'auto';
        });
    </script>
</body>
</html>
